name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Gói NuGet có lỗ hổng đã biết (kể cả gói gián tiếp) làm hỏng CI: `dotnet list` luôn thoát 0 nên phải đọc kết quả.
      - run: |
          dotnet list HakAccounting.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE '^\s+>\s' vulnerable.txt; then echo '::error::Có gói NuGet có lỗ hổng đã biết'; exit 1; fi
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      # Kết quả test (.trx) chỉ cần để điều tra khi có test hỏng: tải lên khi bước trước thất bại, giữ 3 ngày.
      # Hết dung lượng lưu artifact của tài khoản ("Artifact storage quota has been hit", 23/10) không được làm đỏ job khi test đã đạt.
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: TestResults
          retention-days: 3
  # Cùng bộ test tích hợp nhưng chạy trên PostgreSQL (chế độ LAN); mỗi test tạo/xóa DB hak_test_<guid>.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hak_admin
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hak_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HAK_TEST_PG: Host=127.0.0.1;Port=5433;Username=hak_admin;Password=ci_only_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Hak.Integration.Tests -c Release
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Lỗ hổng mức high trở lên làm hỏng CI; máy chủ audit của npm lỗi tạm (503, hết giờ) thì thử lại tối đa 3 lần (xem script).
      - name: npm audit (thử lại khi máy chủ npm lỗi tạm)
        run: bash ../.github/scripts/npm-audit-retry.sh
        timeout-minutes: 10
      - run: npm test
      - run: npm run build
  # Test giao diện bằng trình duyệt thật (Playwright) trên API + dữ liệu thử: Thêm nhanh, Kiểm tra chứng từ, Worklist, tách chu trình mua / bán.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet build src/Hak.Api -c Release
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          E2E_CONFIG: Release
