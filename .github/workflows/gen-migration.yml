name: gen-migration
# Sinh migration EF (SQLite + PostgreSQL) bằng đúng công cụ dotnet-ef rồi đẩy lên chính nhánh đang chạy.
# Dùng khi máy phát triển không có .NET SDK. Commit do GITHUB_TOKEN đẩy sẽ không tự kích hoạt CI; đẩy thêm một commit thật sau đó để CI chạy.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Tên migration (ví dụ Phase12Reservations)
        required: true
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install --global dotnet-ef --version 10.*
      - run: dotnet restore
      - run: dotnet ef migrations add "${{ inputs.name }}" --project src/Hak.Data --output-dir Migrations
      - run: dotnet ef migrations add "${{ inputs.name }}" --project src/Hak.Data.Postgres --startup-project src/Hak.Data.Postgres --output-dir Migrations
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Hak.Data/Migrations src/Hak.Data.Postgres/Migrations
          git commit -m "Migration ${{ inputs.name }} (sinh bằng dotnet-ef trên GitHub Actions)"
          git push
